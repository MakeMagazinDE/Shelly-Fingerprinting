[env:emgen3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

[env:emgen3_ota]
extends = env:emgen3
upload_protocol = espota
; IP-Adresse des umgeflashten Shelly EM Gen3 im eigenen Netz eintragen
upload_port = 192.168.178.XX
